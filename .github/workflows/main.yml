name: Deploy website to GoDaddy

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godaddy-ftps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish standalone site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v6

      - name: Deploy over explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:

          server: ${{ secrets.GODADDY_FTP_SERVER }}
          username: ${{ secrets.GODADDY_FTP_USERNAME }}
          password: ${{ secrets.GODADDY_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*/**
            **/.github/**
            **/assets/**
            **/README*
